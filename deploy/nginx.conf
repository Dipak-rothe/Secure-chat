events {
    worker_connections 1024;
}

http {
    upstream securechat_servers {
        # Sticky sessions by IP for WebSocket affinity if needed, or round-robin
        ip_hash;
        server server1:8080 max_fails=3 fail_timeout=10s;
        server server2:8080 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # WebSocket endpoint with upgrade headers
        location /ws {
            proxy_pass http://securechat_servers;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST API endpoints
        location /api/ {
            proxy_pass http://securechat_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        # Actuator health check
        location /actuator/ {
            proxy_pass http://securechat_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Swagger docs
        location /swagger-ui/ {
            proxy_pass http://securechat_servers;
            proxy_set_header Host $host;
        }

        location /v3/api-docs {
            proxy_pass http://securechat_servers;
            proxy_set_header Host $host;
        }
    }
}
