# Production Docker Compose
# Two Spring Boot instances load-balanced behind Nginx with WebSocket upgrade support.

services:
  nginx:
    image: nginx:1.27.0-alpine
    container_name: securechat-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2

  server1:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: securechat-server-1
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/securechat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: securechat
      SPRING_DATASOURCE_PASSWORD: securechat_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis_pass
      JWT_SECRET: ProductionSecretKeyForSecureChatAppMustBeAtLeast256BitsLong!
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  server2:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: securechat-server-2
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/securechat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: securechat
      SPRING_DATASOURCE_PASSWORD: securechat_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis_pass
      JWT_SECRET: ProductionSecretKeyForSecureChatAppMustBeAtLeast256BitsLong!
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0.39
    container_name: securechat-prod-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_production_pass
      MYSQL_DATABASE: securechat
      MYSQL_USER: securechat
      MYSQL_PASSWORD: securechat_pass
    volumes:
      - mysql_prod_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "securechat", "-psecurechat_pass"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4-alpine
    container_name: securechat-prod-redis
    restart: always
    command: redis-server --requirepass redis_pass
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_prod_data:
  redis_prod_data:
