# Test profile: uses H2 in-memory, no Redis, no Docker required.
# H2 runs in MySQL compatibility mode so Flyway SQL syntax works.

spring:
  datasource:
    url: jdbc:h2:mem:securechattest;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=TYPE,KEY,VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Disable Redis auto-configuration in unit tests to avoid connection errors
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

app:
  jwt:
    secret: "test-secret-key-that-is-at-least-256-bits-long-for-tests-only"
    access-token-expiry-minutes: 15
    refresh-token-expiry-days: 7
  cors:
    allowed-origins: "*"
  rate-limit:
    login-per-minute: 100
    message-per-10-seconds: 100
    search-per-minute: 100
